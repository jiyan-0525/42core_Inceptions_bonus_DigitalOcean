name: 🚀 Inception - Deploy to DigitalOcean
on:
  push:
    branches: [ main ]

jobs:
  deploy:
    # 这里不需要 self-hosted，使用 GitHub 提供的 ubuntu-latest 即可
    runs-on: ubuntu-latest

    steps:
    - name: Deploy to DigitalOcean
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: "46.101.164.165"
        username: jiyawang
        key: ${{ secrets.DO_SSH_KEY }}
        port: 22
        script: |
          cd ~/42core_Inceptions_bonus_DigitalOcean
          git pull origin main
          # 仅在服务器上登录 Docker Hub (如果你的 Dockerfile 需要从私有库拉取镜像)
          echo ${{ secrets.DOCKER_PASSWORD }} | docker login -u ${{ secrets.DOCKER_USERNAME }} --password-stdin
          docker compose down
          # 如果你在服务器本地构建，--build 足够了，无需 pull
          docker compose up -d --build
          docker image prune -f


