name: 🚀 Inception - Deploy to DigitalOcean
on:
  push:
    branches: [ main ]

jobs:
  test-build-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    # - name: Build and push Docker-inception image
    #   uses: docker/build-push-action@v6
    #   with:
    #     context: .
    #     push: true
    #     tags: jiyanwang/inception-docker-digitalocean:latest

    - name: Deploy to DigitalOcean
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: "46.101.164.165"
        username: root
        key: ${{ secrets.DO_SSH_KEY }}
        port: 22
        script: |
          cd ~/42core_Inceptions_bonus_DigitalOcean
          git pull origin main
          # Log in to Docker Hub on the server
          echo ${{ secrets.DOCKER_PASSWORD }} | docker login -u ${{ secrets.DOCKER_USERNAME }} --password-stdin
          docker compose down
          docker compose pull
          docker compose up -d
          docker image prune -f
