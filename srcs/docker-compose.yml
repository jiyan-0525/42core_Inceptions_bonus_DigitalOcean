services:
  mariadb:
    container_name: mariadb
    build:
      context: ./requirements/mariadb
    env_file:
      - .env
    environment:
      - MYSQL_DATABASE=${MYSQL_DATABASE}
      - MYSQL_USER=${MYSQL_USER}
      - MYSQL_PASSWORD_FILE=/run/secrets/db_password
      - MYSQL_ROOT_PASSWORD_FILE=/run/secrets/db_root_password
    volumes:
      - mariadb:/var/lib/mysql
    secrets:
      - db_password
      - db_root_password
    networks:
      - inception
    restart: unless-stopped
    expose:
      - "3306"

  wordpress:
    container_name: wordpress
    build:
      context: ./requirements/wordpress
    env_file:
      - .env
    environment:
      - MYSQL_DATABASE=${MYSQL_DATABASE}
      - MYSQL_USER=${MYSQL_USER}
      - WORDPRESS_DB_HOST=mariadb
    volumes:
      - wordpress:/var/www/html
    secrets:
      - db_password
    networks:
      - inception
    depends_on:
      - mariadb
    restart: unless-stopped
    expose:
      - "9000"

  nginx:
    container_name: nginx
    build:
      context: ./requirements/nginx
      dockerfile: Dockerfile
    ports:
      - "443:443"
    volumes:
      - wordpress:/var/www/html
    depends_on:
      - wordpress
    networks:
      - inception
    restart: unless-stopped

  redis:
    container_name: redis
    build:
      context: ./requirements/bonus/redis
    networks:
      - inception
    restart: unless-stopped

  adminer:
    container_name: adminer
    build:
      context: ./requirements/bonus/adminer
    networks:
      - inception
    depends_on:
      - mariadb
    restart: unless-stopped

  ftp-server:
    container_name: ftp-server
    build:
      context: ./requirements/bonus/vsftpd
    volumes:
      - wordpress:/var/www/html
    environment:
      - FTP_USER=${FTP_USER}
      - FTP_PASS=${FTP_PASS}
    ports:
      - "21:21"
      - "21100-21110:21100-21110"
    networks:
      - inception
    restart: unless-stopped

  portfolio:
    container_name: portfolio
    build:
      context: ./requirements/bonus/portfolio
    networks:
      - inception
    restart: unless-stopped

  portainer:
    container_name: portainer
    build:
      context: ./requirements/bonus/portainer
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer:/data
    networks:
      - inception
    ports:
      - "9443:9443"
    restart: unless-stopped

secrets:
  db_password:
    file: ../secrets/db_password.txt
  db_root_password:
    file: ../secrets/db_root_password.txt

networks:
  inception:
    driver: bridge

volumes:
  mariadb:
    driver: local
    driver_opts:
      type: none
      device: /home/jiyawang/data/mariadb
      o: bind

  wordpress:
    driver: local
    driver_opts:
      type: none
      device: /home/jiyawang/data/wordpress
      o: bind
  portainer:
    driver: local
    driver_opts:
      type: none
      device: /home/jiyawang/data/wordpress
      o: bind

