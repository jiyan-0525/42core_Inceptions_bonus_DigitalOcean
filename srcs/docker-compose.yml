  #   volumes:
  #     - /home/jiyan/data/wordpress:/var/www/html
  #   environment:
  #     - FTP_USER=${FTP_USER}
  #     - FTP_PASS=${FTP_PASS}
  #   ports:
  #     - "21:21"
  #     - "21100-21110:21100-21110"
  #   networks:
  #     - inception
  #   restart: unless-stopped

  portfolio:
    container_name: portfolio
    build:
      context: ./requirements/bonus/portfolio
    networks:
      - inception
    restart: unless-stopped

  portainer:
    container_name: portainer
    build:
      context: ./requirements/bonus/portainer
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /home/jiyan/data/portainer:/data
    networks:
      - inception
    ports:
      - "9443:9443"
    restart: unless-stopped

secrets:
  db_password:
    file: ../secrets/db_password.txt
  db_root_password:
    file: ../secrets/db_root_password.txt

networks:
  inception:
    driver: bridge

